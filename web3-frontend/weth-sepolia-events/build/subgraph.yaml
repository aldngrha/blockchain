specVersion: 0.0.5
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: WETH
    network: sepolia
    source:
      address: "0x7b79995e5f793A07Bc00c21412e50Ecae098E7f9"
      abi: WETH
      startBlock: 5000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transfer
        - TokenHolder
      abis:
        - name: WETH
          file: WETH/WETH.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: WETH/WETH.wasm
