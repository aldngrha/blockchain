[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
gas_reports = ["DexPair", "AMMLibrary"]
# Deploy script nulis deployments/<chainId>.json: default fs_permission cuma read,
# vm.createDir/vm.writeFile bakal revert tanpa ini.
fs_permissions = [{ access = "read-write", path = "./" }]

[fuzz]
runs = 256

# Preset invariant: sama dengan gaya defi-staking (100 x 32 cukup cepat,
# naikin manual sebelum deploy beneran: `FOUNDRY_INVARIANT_RUNS=256
# FOUNDRY_INVARIANT_DEPTH=64 forge test`). Catatan: key-nya snake_case,
# `fail-on-revert` (kebab) DIABAIKAN Foundry tanpa warning.
[invariant]
runs = 100
depth = 32
fail_on_revert = true # revert di handler = invariant gagal, bukan di-skip
